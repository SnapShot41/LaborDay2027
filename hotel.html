    <header class="hero">
        <div class="hero-content">
            <h1>Put your information here</h1>
            <h2>if you would like to use one</h2>
            <p>of the rooms we have available</p>
        </div>
    </header>

<div class="hotel-section">
    <h2 class="hotel-title">Hotel Room Request</h2>

    <form action="https://formspree.io/f/mgogrkqj" method="POST" class="hotel-form">

        <label class="hotel-label">
            Guest Name:
            <input type="text" name="guest-name" placeholder="Enter your name" class="hotel-input" required>
        </label>

        <label class="hotel-label">
            Rooms Needed:
            <select name="rooms-needed" class="hotel-select" required>
                <option value="0">0 Rooms</option>
                <option value="1">1 Room</option>
                <option value="2">2 Rooms</option>
                <option value="3">3 Rooms</option>
                <option value="4">4 Rooms</option>
            </select>
        </label>

        <label class="hotel-label">
            Number of Adults:
            <select name="adult-count" class="hotel-select" required>
                <option value="0">0 Adults</option>
                <option value="1">1 Adult</option>
                <option value="2">2 Adults</option>
                <option value="3">3 Adults</option>
                <option value="4">4 Adults</option>
            </select>
        </label>

        <label class="hotel-label">
            Number of Children:
            <select name="child-count" class="hotel-select" required>
                <option value="0">0 Children</option>
                <option value="1">1 Child</option>
                <option value="2">2 Children</option>
                <option value="3">3 Children</option>
                <option value="4">4 Children</option>
            </select>
        </label>

        <button type="submit" class="hotel-submit">Submit Request</button>

    </form>
</div>    
    
</body>
</html>
